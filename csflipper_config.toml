[discovery]
candidates_limit = 50
min_price = 100
min_volume = 12
currency = "EUR"

[fees]
steam_sale_percent = 13
withdrawal_percent = 20

[fees.withdrawal_percent_by_balance]
steam_balance = 20
platform_balance = 2.5

[steamdt]
default_profile = "steam_sell_slow"
run_all_profiles = true
enabled_profiles = ["steam_sell_slow", "platform_arbitrage_safe"]

[steamdt.profiles.steam_sell_slow]
balance_type = "STEAM Balance"
sell_mode = "Sell at STEAM Lowest Price"
buy_mode = ""

[steamdt.profiles.steam_sell_fast]
balance_type = "STEAM Balance"
sell_mode = "Sell to STEAM Highest Buy Order"
buy_mode = ""

[steamdt.profiles.platform_arbitrage_safe]
balance_type = "Platform Balance"
sell_mode = "Sell at Platform Lowest Price"
buy_mode = "Buy via STEAM Buy Order"

[steamdt.profiles.platform_arbitrage_fast]
balance_type = "Platform Balance"
sell_mode = "Sell to Platform Highest Buy Order"
buy_mode = "Buy at STEAM Lowest Price"

[steamdt.profiles.platform_lowest_to_platform_lowest]
balance_type = "Platform Balance"
sell_mode = "Sell at Platform Lowest Price"
buy_mode = "Buy at STEAM Lowest Price"

[steamdt.profiles.platform_buy_order_to_platform_highest]
balance_type = "Platform Balance"
sell_mode = "Sell to Platform Highest Buy Order"
buy_mode = "Buy via STEAM Buy Order"

[workers]
steam_concurrency = 1
buff_concurrency = 1
batch_size = 5

[delays]
steam_min_seconds = 1.5
steam_max_seconds = 4.0
buff_min_seconds = 2.5
buff_max_seconds = 6.0

[risk]
max_position_fraction = 0.20
max_item_fraction = 0.30
max_platform_fraction = 0.70
max_blocked_fraction = 0.60
min_cash_fraction = 0.10
min_liquidity_quantity = 1
warning_usage_ratio = 0.80
