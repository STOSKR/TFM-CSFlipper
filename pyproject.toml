[project]
name = "tfm-csflipper"
version = "0.1.0"
description = "Sistema multiagente para simulación de inversión en mercados de activos digitales de CS2."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "playwright>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pytesseract>=0.3",
    "spade>=4.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
ml = [
    "tensorflow>=2.16",
]
dev = [
    "coverage>=7.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
